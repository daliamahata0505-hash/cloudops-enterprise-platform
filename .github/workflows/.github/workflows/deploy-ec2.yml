
name: Deploy CloudOps to EC2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-ec2.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull daliamahata/cloudops-enterprise-platform:latest
            sudo docker rm -f cloudops-container || true
            sudo docker run -d --name cloudops-container --restart unless-stopped -p 80:8000 daliamahata/cloudops-enterprise-platform:latest
            curl -fsS http://localhost/health
