
name: Deploy CloudOps to EC2

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Python Application Check
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Pulling latest Docker image..."
            sudo docker pull daliamahata/cloudops-enterprise-platform:latest

            echo "Replacing application container..."
            sudo docker rm -f cloudops-container || true

            sudo docker run -d \
              --name cloudops-container \
              --restart unless-stopped \
              -p 80:8000 \
              daliamahata/cloudops-enterprise-platform:latest

            echo "Checking application health..."
            for i in $(seq 1 15); do
              if curl -fsS http://localhost/health; then
                echo ""
                echo "Deployment successful!"
                exit 0
              fi

              echo "Waiting for application ($i/15)..."
              sleep 2
            done

            echo "Health check failed. Container logs:"
            sudo docker logs --tail 50 cloudops-container
            exit 1
